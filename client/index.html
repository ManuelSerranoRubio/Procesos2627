<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de usuarios — Sprint 1</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./styles.css">
  <script src="./apiClient.js"></script>
  <script src="./app.js"></script>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">Procesos 2026/27 — Sprint 1</span>
      <div class="d-flex align-items-center gap-2">
        <span id="sessionInfo" class="text-light small">No has iniciado sesión</span>
        <button id="logoutBtn" type="button" class="btn btn-sm btn-outline-light" hidden>Cerrar sesión</button>
        <button id="deleteMeBtn" type="button" class="btn btn-sm btn-outline-danger" hidden>Eliminar mi cuenta</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-4">Gestión de usuarios</h1>
    <div id="msg" class="alert" role="alert" hidden></div>

    <section id="authPanel" class="row g-4">
      <div class="col-md-6">
        <div class="card h-100">
          <div class="card-header">Iniciar sesión</div>
          <div class="card-body">
            <form id="loginForm">
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="loginEmail" autocomplete="username" required>
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="loginPassword" autocomplete="current-password" required>
              </div>
              <button type="submit" class="btn btn-primary">Entrar</button>
            </form>
            <hr>
            <a id="googleLink" href="/api/auth/google" class="btn btn-outline-danger" hidden>Entrar con Google</a>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card h-100">
          <div class="card-header">Registro local</div>
          <div class="card-body">
            <form id="registerForm">
              <div class="mb-3">
                <label for="registerEmail" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="registerEmail" autocomplete="username" required>
              </div>
              <div class="mb-3">
                <label for="registerPassword" class="form-label">Contraseña (mínimo 8 caracteres)</label>
                <input type="password" class="form-control" id="registerPassword" autocomplete="new-password" minlength="8" required>
              </div>
              <button type="submit" class="btn btn-success">Registrarse</button>
            </form>
            <p class="form-text mt-3">Deberás confirmar tu correo antes de poder iniciar sesión.</p>
          </div>
        </div>
      </div>
    </section>

    <section id="adminPanel" class="card mt-4" hidden>
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Panel de administrador</span>
        <button id="reloadUsersBtn" type="button" class="btn btn-sm btn-outline-secondary">Actualizar lista</button>
      </div>
      <div class="card-body">
        <table class="table table-striped align-middle">
          <thead>
            <tr>
              <th>Correo</th><th>Rol</th><th>Estado</th><th>Activo</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
